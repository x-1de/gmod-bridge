[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmod-bridge"
version = "0.2.0b1"
description = "Desktop tools for Garry's Mod models, maps and Blender"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6-Essentials==6.8.3", "Pillow>=10,<14", "numpy>=1.26,<3"]
classifiers = ["Development Status :: 4 - Beta", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.scripts]
gmod-bridge-cli = "gm2b.cli:main"

[project.gui-scripts]
gmod-bridge = "gm2b.app:main"

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2", "pyinstaller>=6.11,<7"]

[tool.setuptools.packages.find]
include = ["gm2b*"]
namespaces = true

[tool.setuptools.package-data]
gm2b = ["blender_addon/*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", ".release-venv", ".build-venv", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
